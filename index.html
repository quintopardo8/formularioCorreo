<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Contacto | Correos </title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css"/>
    </head>
  
    <body>
        <header class="encabezado">
            <div>
                <h1>Correos</h1>
            </div>
        </header>

        <main class="contenedor-principal">
            
            <div class="formulario">

                <div class="encabezado-formulario">
                    <p class="subtitulo">FORMULARIO DE CONTACTO</p>
                    <h2>En qué podemos ayudarte?</h2>
                    <p class="subtitulo">Los campos marcados con * son obligatorios</p>
                </div>

                <div class="campo">
                    <h4>1. Datos</h4>    
                </div>
                <div class="campo">
                    <label for="nombre"><strong>Nombre:</strong> </label>
                    <input type="text" id="nombre">
                </div>
                
                <div class="campo">
                    <label for="apellido"><strong>Apellidos:</strong> </label>
                    <input type="text" id="apellido">
                </div>
                
                <div class="campo">
                    <label for="email"><strong>Correo Electrónico:</strong> </label>
                    <input type="email" id="email" placeholder="nombre@correo.cl">
                </div>
                
                <div class="campo">
                    <label for="telefono"><strong>Teléfono celular</strong></label>
                    <input type="tel" id="telefono" placeholder="Ej: 987000624">    
                </div>
                
                <div class="campo">
                    <h4>2. Mensaje</h4>    
                </div>

                <div class="campo">
                    <label for="asunto"><strong>Asunto</strong></label>
                    <select id="asunto">
                        <option value="">Selecciona un asunto</option>
                        <option value="consulta">Consulta general</option>
                        <option value="seguimiento">Seguimiento de Envío</option>
                        <option value="reclamo">Reclamo o Sugerencia</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="mensaje"><strong>Mensaje</strong></label>
                    <textarea id="mensaje" rows="4" placeholder="Escribe aquí tu consulta"></textarea>
                </div>

            </div>

            

            <aside class="info">
                <h3>Horario de Atención</h3>
                <p>Lunes a Viernes de 09:00 a 18:00 Hrs.</p>
                <h3>Sucursal Central</h3>
                <p>Victoria 2479, Valparaíso</p>
            </aside>

        </main>
        
    </body>    



</html>
