<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Contacto | Correos </title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css"/>
    </head>
  
    <body>
        <header class="encabezado">
            <div>
                <h1>Correos</h1>
            </div>
        </header>

        <main class="contenedor-principal">
            
            <div class="formulario">
                
                <div class="campo">
                    <label for="nombre"><strong>Nombre:</strong> </label>
                    <input type="text" id="nombre">
                </div>
                
                <div class="campo">
                    <label for="apellido"><strong>Apellidos:</strong> </label>
                    <input type="text" id="apellido">
                </div>
                
                <div class="campo">
                    <label for="email"><strong>Correo Electrónico:</strong> </label>
                    <input type="email" id="email" placeholder="nombre@correo.cl">
                </div>
                
                <div class="campo">
                    <label for="telefono"><strong>Teléfono celular</strong></label>
                    <input type="tel" id="telefono" placeholder="Ej: 987000624">    
                </div>

            </div>

            <aside class="info">
                <h3>Horario de Atención</h3>
                <p>Lunes a Viernes de 09:00 a 18:00 Hrs.</p>
                <h3>Sucursal Central</h3>
                <p>Victoria 2479, Valparaíso</p>
            </aside>

        </main>
        
    </body>    



</html>
